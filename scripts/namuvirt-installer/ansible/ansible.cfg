[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
forks = 20
timeout = 30
# yaml 형식 출력 — community.general.yaml 콜백(제거됨) 대신 ansible-core 내장 default + result_format 사용.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# 인벤토리 파일 없음 — config.yaml을 읽어 site.yml의 첫 play(localhost)가
# add_host로 동적으로 구성한다.

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# 파일 다수 전송(copy loop) 성능의 핵심: SSH 연결을 재사용(ControlPersist)해서
# 파일마다 재접속(핸드셰이크)하지 않도록 한다. pipelining 은 모듈 호출당 SSH 왕복을 줄인다.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no
control_path_dir = /tmp/.ansible-cp
# 대용량 파일은 scp 가 sftp 보다 빠른 경우가 많다.
transfer_method = scp
retries = 2
