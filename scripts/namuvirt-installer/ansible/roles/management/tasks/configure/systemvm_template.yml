---
# seed_systemvm_template() — secondary 스토리지에 KVM SystemVM 템플릿을 시드한다.
# 하네스: SystemVM 템플릿은 이미지에 넣지 않고 외부 mount(/mnt/namuvirt/images/...)로 제공한다.
# 컨테이너(controller) 안에서 mount 된 파일을 관리 VM 으로 전송한 뒤 file:// URL 로 시드한다.
#
# systemvm_template 은 config.yaml management.systemvm_template (기본 /mnt/namuvirt/images/...) 의
# 절대 경로이며, dest 파일명은 그 basename 을 사용한다.

- name: cloud-install-sys-tmplt 존재 확인
  ansible.builtin.stat:
    path: /usr/share/cloudstack-common/scripts/storage/secondary/cloud-install-sys-tmplt
  register: _sys_tmplt_script
  tags: [management, configure]

- name: cloud-install-sys-tmplt 누락 경고
  ansible.builtin.debug:
    msg: "WARN: cloud-install-sys-tmplt missing — cloudstack-common 설치를 확인할 것"
  when: not _sys_tmplt_script.stat.exists
  tags: [management, configure]

- name: SystemVM 템플릿 시드
  when: _sys_tmplt_script.stat.exists
  tags: [management, configure]
  block:
    - name: SystemVM 템플릿 파일을 관리 VM으로 전송 (외부 mount → VM)
      ansible.builtin.copy:
        src: "{{ systemvm_template }}"
        dest: "{{ management_server_work_dir }}/systemvm/{{ systemvm_template | basename }}"
        mode: "0644"

    - name: cloud-install-sys-tmplt 실행 (이미 시드되어 있으면 skip)
      ansible.builtin.command: >
        /usr/share/cloudstack-common/scripts/storage/secondary/cloud-install-sys-tmplt
        -m {{ secondary_storage }}
        -u file://{{ management_server_work_dir }}/systemvm/{{ systemvm_template | basename }}
        -h kvm -F
      args:
        creates: "{{ secondary_storage }}/.namuvirt-systemvm-seeded"

    - name: SystemVM 시드 완료 마커 생성
      ansible.builtin.file:
        path: "{{ secondary_storage }}/.namuvirt-systemvm-seeded"
        state: touch
        mode: "0644"
