---
# secondary storage 를 관리 VM 에 준비한다 (v2: secondary_storage dict 기반).
#
# 동작(secondary_storage.protocol 기준):
#   - nfs  + export_host_ip 지정 → 그 호스트의 NFS export 를 secondary 로 마운트.
#   - nfs  + export_host_ip 비움 → 로컬 디렉터리 그대로 사용(마운트 안 함).
#   - local                     → 로컬 디렉터리 그대로 사용(마운트 안 함).
#   - ceph                      → 스텁(미구현) 으로 중단.
#
# 참고: secondary 는 CloudStack 상 zone 공유라 관리 VM 은 공통 path/export_host_ip 기준으로만
# 마운트한다(secondary 의 호스트별 override 는 관리 VM 마운트에는 반영하지 않는다).

- name: secondary storage 유효값 추출
  ansible.builtin.set_fact:
    _sec_protocol: "{{ secondary_storage.protocol }}"
    _sec_path: "{{ secondary_storage.path }}"
    _sec_export_ip: "{{ secondary_storage.export_host_ip | default('') }}"
  tags: [management, configure]

- name: secondary storage ceph 스텁 차단
  ansible.builtin.fail:
    msg: >-
      secondary storage protocol=ceph 는 아직 구현되지 않았다(스텁).
      현재 지원은 nfs 또는 local 뿐이다.
  when: _sec_protocol == 'ceph'
  tags: [management, configure]

- name: "_sec_nfs_mount 판정 (nfs + export_host_ip 지정 시에만 마운트)"
  ansible.builtin.set_fact:
    _sec_nfs_mount: "{{ (_sec_protocol == 'nfs') and (_sec_export_ip != '') }}"
  tags: [management, configure]

- name: secondary storage 디렉터리 생성 (로컬/마운트 포인트 공용)
  ansible.builtin.file:
    path: "{{ _sec_path }}"
    state: directory
    mode: "0755"
  tags: [management, configure]

- name: secondary storage 모드 안내
  ansible.builtin.debug:
    msg: >-
      secondary storage =
      {{ 'NFS 마운트 (' ~ _sec_export_ip ~ ':' ~ _sec_path ~ ')'
         if _sec_nfs_mount | bool
         else '로컬 디렉터리 (' ~ _sec_path ~ ') — NFS 마운트 안 함 [protocol=' ~ _sec_protocol ~ ']' }}
  tags: [management, configure]

# ── 아래는 nfs + export_host_ip 지정된 경우에만 실행 ──────────────────────────
- name: /etc/fstab 에 NFS secondary 항목 추가
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ _sec_export_ip | regex_escape }}:{{ _sec_path | regex_escape }}\\s"
    line: "{{ _sec_export_ip }}:{{ _sec_path }} {{ _sec_path }} nfs defaults,_netdev 0 0"
  when: _sec_nfs_mount | bool
  tags: [management, configure]

- name: secondary storage 마운트 여부 확인
  ansible.builtin.command: mountpoint -q {{ _sec_path }}
  register: _secondary_mounted
  changed_when: false
  failed_when: false
  when: _sec_nfs_mount | bool
  tags: [management, configure]

- name: secondary storage 마운트
  ansible.builtin.command: mount -t nfs {{ _sec_export_ip }}:{{ _sec_path }} {{ _sec_path }}
  when:
    - _sec_nfs_mount | bool
    - _secondary_mounted.rc != 0
  tags: [management, configure]
