---
# configure_time_sync() — chrony 서비스 유닛명이 배포판/버전마다 다르다:
#   Rocky: chronyd  /  Ubuntu 22.04: chrony  /  Ubuntu 24.04: chronyd
# 하드코딩하면 24.04 에서 'chrony' 를 못 찾아 실패하므로, 실제 설치된 유닛명을 조회해 사용한다.
- name: chrony 서비스 유닛명 결정 (chronyd 우선, 없으면 chrony)
  ansible.builtin.shell: >-
    if systemctl list-unit-files chronyd.service --no-legend | grep -q chronyd;
    then echo chronyd; else echo chrony; fi
  register: _chrony_unit
  changed_when: false
  tags: [kvm_hosts]

- name: chrony 서비스 활성화
  ansible.builtin.systemd:
    name: "{{ _chrony_unit.stdout | trim }}"
    state: started
    enabled: true
  tags: [kvm_hosts]