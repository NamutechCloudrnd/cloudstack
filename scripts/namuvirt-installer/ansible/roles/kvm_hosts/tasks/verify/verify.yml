---
# verify_host() — KVM·NFS·libvirt·agent·exporter·브리지 IP 등 호스트 최종 점검.
# die가 아니라 assert로 멈출 것 / warn으로 넘어갈 것을 원본과 동일하게 구분한다.

- name: KVM 디바이스/virsh 확인
  ansible.builtin.command: "{{ item }}"
  loop:
    - "test -e /dev/kvm"
    - "virsh version"
  changed_when: false
  tags: [kvm_hosts, verify]

# grep -q 는 매치 즉시 종료해 파이프를 닫고, 그 결과 lsmod 가 SIGPIPE(rc=141)로 죽는다.
# pipefail 이 이를 파이프라인 실패로 보고해, 모듈이 실제로 로드됐는데도 거짓 실패했다.
# grep -q 대신 전체 입력을 다 읽는 형태(>/dev/null)로 바꿔 SIGPIPE 를 없앤다.
- name: kvm 커널 모듈 로드 확인
  ansible.builtin.shell: "set -o pipefail; lsmod | grep -E '^kvm(_intel|_amd)?[[:space:]]' >/dev/null"
  args:
    executable: /bin/bash
  changed_when: false
  tags: [kvm_hosts, verify]

# NFS 사용 여부(storage.yml 의 _any_nfs 와 동일 판정) — 아래 서비스/idmapd 검증에서
# 재사용한다. primary/secondary 둘 다 local/ceph 이면 nfs 관련 검증을 건너뛴다.
- name: NFS 사용 여부 판정
  ansible.builtin.set_fact:
    _any_nfs: "{{ (primary_storage.protocol == 'nfs') or (secondary_storage.protocol == 'nfs') }}"
  tags: [kvm_hosts, verify]

# systemctl is-active 로 검증한다. nfs-server 는 Rocky 8 에서 Type=oneshot 이라
# 정상일 때 "active (exited)" 상태이며 is-active 는 이를 "active" 로 보고한다.
# (service_facts 의 .state 는 exited 를 'stopped' 로 보고해 오탐이 난다.)
# rpcbind/nfs 서비스는 storage.yml 에서 nfs 사용 시(_any_nfs)에만 기동하므로,
# 둘 다 local/ceph 이면 검증 대상에서 제외한다(libvirtd 는 항상 필수).
- name: 필수 서비스 active 확인 (systemctl is-active)
  ansible.builtin.command: "systemctl is-active {{ item }}"
  changed_when: false
  register: _svc_active
  failed_when: _svc_active.rc != 0
  loop: "{{ _required_services }}"
  vars:
    _nfs_services: >-
      {{ ['rpcbind', 'nfs-kernel-server']
         if ansible_distribution == 'Ubuntu'
         else ['rpcbind', 'nfs-server'] }}
    _required_services: "{{ ['libvirtd'] + (_nfs_services if _any_nfs | bool else []) }}"
  loop_control:
    label: "{{ item }}"
  tags: [kvm_hosts, verify]

# chrony(시간 동기화)는 폐쇄망에서 오프라인 번들 누락으로 미설치일 수 있어 하드 실패시키지
# 않고 경고만 한다(유닛명은 chronyd/chrony 모두 허용). time_sync.yml 의 처리와 일관.
- name: chrony(시간 동기화) active 확인 (실패해도 warn)
  ansible.builtin.shell: "systemctl is-active chronyd 2>/dev/null || systemctl is-active chrony 2>/dev/null"
  register: _chrony_active
  changed_when: false
  failed_when: false
  tags: [kvm_hosts, verify]

- name: chrony 비활성/미설치 경고
  ansible.builtin.debug:
    msg: >-
      WARN: {{ inventory_hostname }} 시간 동기화(chrony) 미동작 — 설치 후 chrony 또는 다른
      NTP 를 반드시 구성할 것 (CloudStack 은 관리서버/호스트 시간 동기가 필요).
  when: _chrony_active.rc | default(1) != 0
  tags: [kvm_hosts, verify]

- name: cloudstack-agent active 확인 (skip_agent 가 아닐 때만, 실패해도 warn)
  ansible.builtin.command: systemctl is-active --quiet cloudstack-agent
  register: _agent_active
  changed_when: false
  failed_when: false
  when: not (skip_agent | default(true))
  tags: [kvm_hosts, verify]

- name: cloudstack-agent 비활성 경고
  ansible.builtin.debug:
    msg: "WARN: cloudstack-agent is not active (check guid, Java 17, management VM reachability)"
  when:
    - not (skip_agent | default(true))
    - _agent_active.rc | default(1) != 0
  tags: [kvm_hosts, verify]

- name: agent.properties host= 확인
  ansible.builtin.command: grep -q '^host={{ management_ip }}$' /etc/cloudstack/agent/agent.properties
  changed_when: false
  when: not (skip_agent | default(true))
  tags: [kvm_hosts, verify]

# idmapd Domain 은 storage_nfs.yml 에서만 설정하므로 nfs 사용 시에만 검사한다.
- name: idmapd.conf Domain 확인 (nfs 사용 시)
  ansible.builtin.command: "grep -q '^Domain[[:space:]]*=[[:space:]]*{{ nfs_domain }}$' /etc/idmapd.conf"
  changed_when: false
  when: _any_nfs | bool
  tags: [kvm_hosts, verify]

- name: libvirt 설정 파일 확인
  ansible.builtin.command: "{{ item }}"
  loop:
    - "grep -q '^vnc_listen[[:space:]]*=' /etc/libvirt/qemu.conf"
    - "grep -q '^listen_tcp[[:space:]]*=' /etc/libvirt/libvirtd.conf"
    - "grep -q 'LIBVIRTD_ARGS=\"--listen\"' {{ '/etc/default/libvirtd' if ansible_distribution == 'Ubuntu' else '/etc/sysconfig/libvirtd' }}"
  changed_when: false
  tags: [kvm_hosts, verify]

# protocol=nfs 인 스토리지만 export 를 검사한다(local/ceph 은 export 없음).
# 호스트별 override(hosts[host_ip].path)가 있으면 그 경로를 사용한다.
- name: NFS export 검사 대상 경로 계산 (nfs 프로토콜만)
  ansible.builtin.set_fact:
    _nfs_export_paths: >-
      {{ ([ primary_storage.hosts[host_ip].path | default(primary_storage.path, true) ]
           if primary_storage.protocol == 'nfs' else [])
       + ([ secondary_storage.hosts[host_ip].path | default(secondary_storage.path, true) ]
           if secondary_storage.protocol == 'nfs' else []) }}
  tags: [kvm_hosts, verify]

# grep -q 조기종료 → producer SIGPIPE(rc=141) 오탐 방지: 전체 입력을 읽는 형태로.
- name: NFS export 확인 (nfs 프로토콜 스토리지만)
  ansible.builtin.shell: "set -o pipefail; exportfs -v | grep '{{ item }}' >/dev/null"
  args:
    executable: /bin/bash
  loop: "{{ _nfs_export_paths }}"
  changed_when: false
  tags: [kvm_hosts, verify]

- name: 브리지 IP 확인
  ansible.builtin.shell: "set -o pipefail; ip -br addr show {{ bridge_name }} | grep '{{ host_ip }}' >/dev/null"
  args:
    executable: /bin/bash
  changed_when: false
  tags: [kvm_hosts, verify]

# docker(설치 컨테이너 호스트=master)의 FORWARD DROP 에 게스트 트래픽이 걸리지 않도록
# bridge-nf-call-iptables 가 0 인지 확인한다. 1 이면 관리 VM 이 gateway 밖으로 못 나간다.
- name: bridge-nf-call-iptables=0 확인 (게스트 외부통신 보장)
  ansible.builtin.command: sysctl -n net.bridge.bridge-nf-call-iptables
  register: _bridge_nf
  changed_when: false
  failed_when: false
  tags: [kvm_hosts, verify]

- name: bridge-nf-call-iptables 비정상 경고
  ansible.builtin.debug:
    msg: >-
      WARN: net.bridge.bridge-nf-call-iptables={{ _bridge_nf.stdout | default('?') }}
      (0 이어야 함). docker FORWARD DROP 에 게스트 트래픽이 걸릴 수 있다 —
      namuvirt-bridge-nf.service 상태를 확인하라.
  when: (_bridge_nf.stdout | default('1')) != '0'
  tags: [kvm_hosts, verify]

- name: exporter 응답 확인 (실패해도 warn만)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}/metrics"
    status_code: 200
    timeout: 5
  loop: [9100, 9256, 9177]
  register: _exporter_check
  failed_when: false
  tags: [kvm_hosts, verify]

- name: exporter 미응답 경고
  ansible.builtin.debug:
    msg: "WARN: exporter on port {{ item.item }} not responding"
  loop: "{{ _exporter_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) != 200
  tags: [kvm_hosts, verify]

- name: VMware 변환 도구 확인 (활성화된 경우만)
  ansible.builtin.command: "{{ item }}"
  loop:
    - "command -v virt-v2v"
    - "command -v nbdkit"
  changed_when: false
  when: kvm_enable_vmware_conversion | default(false) | bool
  tags: [kvm_hosts, verify]
