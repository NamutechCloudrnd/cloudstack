---
# cloudstack-agent 설치 (Ubuntu) — install_agent() + configure_java17() 포팅.
# packages_root/namuvirt/ubuntu/ 에 패키지가 없으면 skip(WARN).

- name: namuvirt 패키지 경로 확정 (Ubuntu)
  ansible.builtin.set_fact:
    _namuvirt_pkg_dir: "{{ packages_root }}/namuvirt/ubuntu"
  tags: [kvm_hosts, agent]

# deb 파일명은 Debian 규칙으로 name_version_arch.deb (name 뒤가 '_'). rpm 스타일 하이픈
# 패턴("cloudstack-common-*.deb")은 "cloudstack-common_...deb" 를 못 잡아 agent 설치가
# 통째로 skip 됐다. '_' 를 기본으로, 혹시 모를 하이픈 변형까지 [-_] 로 함께 매칭한다.
- name: cloudstack-common DEB 탐색
  ansible.builtin.find:
    paths: "{{ _namuvirt_pkg_dir }}"
    patterns: "cloudstack-common[-_]*.deb"
  delegate_to: localhost
  become: false
  register: _common_pkg
  tags: [kvm_hosts, agent]

- name: cloudstack-agent DEB 탐색
  ansible.builtin.find:
    paths: "{{ _namuvirt_pkg_dir }}"
    patterns: "cloudstack-agent[-_]*.deb"
  delegate_to: localhost
  become: false
  register: _agent_pkg
  tags: [kvm_hosts, agent]

- name: agent 설치 가능 여부 결정
  ansible.builtin.set_fact:
    skip_agent: "{{ (_common_pkg.files | length == 0) or (_agent_pkg.files | length == 0) }}"
  tags: [kvm_hosts, agent]

- name: 패키지 없음 — agent 설치 skip 경고
  ansible.builtin.debug:
    msg: >-
      WARN: cloudstack-common/agent DEB이 {{ _namuvirt_pkg_dir }} 에 없다 — agent 설치를 건너뜀.
      packages/namuvirt/ubuntu/ 에 배포 패키지를 배치할 것.
  when: skip_agent
  tags: [kvm_hosts, agent]

- name: cloudstack-agent 설치 및 설정 (Ubuntu)
  when: not skip_agent
  tags: [kvm_hosts, agent]
  block:
    - name: Java 17 JDK 디렉터리 탐색
      ansible.builtin.find:
        paths: /usr/lib/jvm
        file_type: directory
        patterns: "java-17-openjdk*"
      register: _java17_dirs

    - name: Java 17 미발견 경고
      ansible.builtin.debug:
        msg: "WARN: java-17-openjdk not found in /usr/lib/jvm"
      when: _java17_dirs.files | length == 0

    - name: 시스템 기본 java를 17로 설정
      ansible.builtin.command: >
        update-alternatives --set java {{ (_java17_dirs.files | sort(attribute='path') | first).path }}/bin/java
      when: _java17_dirs.files | length > 0
      changed_when: true

    - name: 패키지 전송 디렉터리 생성
      ansible.builtin.file:
        path: /opt/namuvirt/packages
        state: directory
        mode: "0755"

    - name: cloudstack-common/agent DEB 전송
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "/opt/namuvirt/packages/{{ item.path | basename }}"
        mode: "0644"
      loop:
        - "{{ _common_pkg.files[0] }}"
        - "{{ _agent_pkg.files[0] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # 무인 설치라 conffile/ debconf 프롬프트로 멈추면 안 된다. DEBIAN_FRONTEND=noninteractive +
    # --force-confdef/confold 로 프롬프트 없이 진행한다(기존 conffile 유지 → 뒤의 lineinfile 이
    # host/guid 등만 덮어씀). 의존성이 번들(os-packages/cloudstack)로 이미 깔려 있어야 configure 된다.
    - name: cloudstack-common/agent DEB 설치
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        dpkg -i --force-confdef --force-confold \
          /opt/namuvirt/packages/{{ _common_pkg.files[0].path | basename }} \
          /opt/namuvirt/packages/{{ _agent_pkg.files[0].path | basename }} 2>&1
        dpkg --configure -a --force-confdef --force-confold 2>&1
      args:
        executable: /bin/bash
      register: _cs_dpkg
      changed_when: true
      failed_when: false

    # dpkg -i 는 패키지 순서/의존성 때문에 1차에서 non-zero 로 끝날 수 있어 위는 관대하게 두고,
    # 최종 설치 상태로 판정한다. 미충족 의존성이 있으면 iU(unpacked, 미설정) 로 남는데, 이때
    # 파일은 풀려 있고 서비스도 뜨기 때문에 UI 에는 호스트가 Up 으로 보인다. 조용히 넘기면
    # 반쯤 설치된 상태가 그대로 운영에 들어가므로 여기서 잡는다.
    - name: cloudstack-common/agent 설치 상태 확인
      ansible.builtin.command: dpkg-query -W -f=${Status} {{ item }}
      loop:
        - cloudstack-common
        - cloudstack-agent
      register: _cs_status
      changed_when: false
      failed_when: false

    - name: 설치가 완료되지 않은 패키지 판정
      ansible.builtin.set_fact:
        _cs_bad: "{{ _cs_status.results | selectattr('stdout', 'ne', 'install ok installed') | map(attribute='item') | list }}"

    - name: DEB 설치 미완료 시 중단
      ansible.builtin.fail:
        msg: |
          cloudstack 패키지 설치가 완료되지 않았다: {{ _cs_bad | join(', ') }}
          {% for r in _cs_status.results %}
            {{ r.item }} = {{ r.stdout | default('(조회 실패)') }}
          {% endfor %}
          미충족 의존성이 원인이면 packages/os-packages/ubuntu/ 의 해당 deb 를 먼저 배포해야 한다.
          --tags agent 는 os-packages 를 배포하지 않으므로, 의존성이 늘어난 업그레이드에서는
          --tags kvm_hosts 로 실행하거나 해당 deb 를 수동 설치한 뒤 재실행할 것.

          dpkg 출력(마지막 부분):
          {{ (_cs_dpkg.stdout | default('') | trim)[-1200:] }}
      when: _cs_bad | length > 0

    - name: agent.properties 기본 키 설정
      ansible.builtin.lineinfile:
        path: /etc/cloudstack/agent/agent.properties
        regexp: "^#?{{ item.key | regex_escape }}="
        line: "{{ item.key }}={{ item.value }}"
        create: true
        mode: "0644"
      loop:
        - { key: host, value: "{{ management_ip }}" }
        - { key: port, value: "{{ agent_port }}" }
        - { key: public.network.device, value: "{{ bridge_name }}" }
        - { key: private.network.device, value: "{{ bridge_name }}" }
        - { key: guest.network.device, value: "{{ bridge_name }}" }

    - name: agent.properties guid/local.storage.uuid 현재 값 확인
      ansible.builtin.shell: >
        set -o pipefail;
        grep -E '^#?{{ item }}=' /etc/cloudstack/agent/agent.properties
        | tail -1 | cut -d= -f2- | tr -d '[:space:]'
      args:
        executable: /bin/bash
      loop:
        - guid
        - local.storage.uuid
      register: _agent_uuid_current
      changed_when: false
      failed_when: false

    # uuidgen(util-linux/uuid-runtime)은 Ubuntu 24.04 오프라인 번들에 없을 수 있다.
    # 커널이 제공하는 /proc 경로는 패키지 없이 어디서나 UUID 를 생성한다(Rocky/Ubuntu 공통).
    - name: 비어있는 guid/local.storage.uuid 용 uuid 생성
      ansible.builtin.command: cat /proc/sys/kernel/random/uuid
      loop: "{{ _agent_uuid_current.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _agent_uuid_generated
      changed_when: true
      when: item.stdout | default('') | trim == ''

    - name: agent.properties guid/local.storage.uuid 기록 (비어있던 항목만)
      ansible.builtin.lineinfile:
        path: /etc/cloudstack/agent/agent.properties
        regexp: "^#?{{ item.item.item }}="
        line: "{{ item.item.item }}={{ item.stdout }}"
      loop: "{{ _agent_uuid_generated.results }}"
      loop_control:
        label: "{{ item.item.item | default('skipped') }}"
      when: item.skipped is not defined

    - name: Java 17 JDK home 경로 확인
      ansible.builtin.find:
        paths: /usr/lib/jvm
        file_type: directory
        patterns: "java-17-openjdk*"
      register: _java17_jdk_dirs

    - name: cloudstack-agent systemd override 디렉터리 생성
      ansible.builtin.file:
        path: /etc/systemd/system/cloudstack-agent.service.d
        state: directory
        mode: "0755"

    - name: cloudstack-agent Java 17 systemd override 배포
      ansible.builtin.template:
        src: java17.conf.j2
        dest: /etc/systemd/system/cloudstack-agent.service.d/java17.conf
        mode: "0644"
      vars:
        java17_bin: "{{ (_java17_jdk_dirs.files | sort(attribute='path') | first).path }}/bin/java"
      notify: reload systemd

    - name: libvirtd / cloudstack-agent 활성화
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - libvirtd
        - cloudstack-agent
