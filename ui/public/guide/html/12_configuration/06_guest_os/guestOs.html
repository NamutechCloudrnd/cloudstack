<h2 id="게스트-os">게스트 OS</h2>
<blockquote>
<p>namuVIRT에서 사용할 게스트 OS 정보를 관리하는 기능이다. 가상머신 생성
시 설치할 운영체제 정보를 등록하고 버전을 관리할 수 있다.</p>
<p>namuVIRT에서 기본으로 제공하는 매핑 목록이 존재하며, 추가 버튼을
클릭하여 직접 게스트 OS를 등록할 수 있다.</p>
<p><img src="../../images/12_configuration/06_guest_os/image16.png"
style="width:6.57813in;height:3.20833in" /></p>
<p>상세 페이지에서 해당 게스트 OS를 수정 및 삭제할 수 있으며, 새로운
하이퍼바이저 매핑을 추가할 수 있다. 또한 해당 게스트 OS를 사용중인
게스트 OS 매핑 목록으로 이동할 수 있다.</p>
<p><img src="../../images/12_configuration/06_guest_os/image32.png"
style="width:6.57813in;height:3.20833in" /></p>
</blockquote>
